name: Golf Wire Content Pipeline

on:
  schedule:
    # Hourly, paired with MAX_ARTICLES_PER_RUN = 2 in scripts/generate-article.js.
    # The old '0 */3 * * *' at 5 articles/run published in visible clumps; two an
    # hour still leaves 48/day of capacity against an actual rate of 5-9.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles to generate per run (default: 2)'
        required: false
        type: string

# An hourly schedule can catch up with a slow run: the job may take up to 30
# minutes, and a scrape that stalls could still be holding the repo when the
# next tick fires. Two runs committing generated articles at once would race on
# the push. Queue instead of cancelling, so a run that is mid-publish is never
# killed part-way through.
concurrency:
  group: golf-wire-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Step 1a — Scrape Golf Wire RSS
        run: node scripts/scrape-golfwire.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Step 1b — Scrape brand press rooms
        run: node scripts/scrape-pressrooms.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Step 2 — Match brands
        run: node scripts/match-brands.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Step 3 — Generate articles
        run: node scripts/generate-article.js ${{ github.event.inputs.max_articles || '' }}
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Verify index pages
        run: npm run verify:index-pages

      - name: Verify scorecard pages
        run: npm run verify:scorecard

      - name: Verify sitemap (no orphans before commit)
        run: npm run verify:sitemap

      # A newly generated page that carries interactive markup but not the
      # script that binds to it renders fine and does nothing. Catch it before
      # the commit step rather than after it is live.
      - name: Verify interactive markup has its handler
        run: npm run verify:page-scripts

      - name: Commit generated articles
        run: |
          set -e  # Any failure in this step aborts it — publish step is skipped on failure

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage new article pages, hero images, the updated sitemap, and
          # the search index (regenerated by generateSearchIndex() on every article).
          # search-index.json MUST be staged here — an unstaged tracked file causes
          # `git pull --rebase` to abort even for a no-op rebase (git 2.x behavior).
          git add news/ images/articles/ sitemap.xml search-index.json

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No new articles generated — nothing to commit."
          else
            ARTICLE_COUNT=$(git diff --cached --name-only | grep "^news/" | grep "index.html" | wc -l | tr -d ' ')
            git commit -m "feat: add ${ARTICLE_COUNT} article(s) [skip ci]"

            # Rebase onto latest remote before pushing.
            # -X theirs auto-resolves add/add conflicts (identical new files from
            # concurrent runs) without manual intervention.
            git pull --rebase -X theirs origin main

            git push
            echo "Committed and pushed ${ARTICLE_COUNT} new article(s)."
          fi

      - name: Publish articles (draft → published in Supabase)
        # Runs only when the commit step succeeds (set -e ensures push failures
        # cause the commit step to fail, which skips this step automatically).
        # Only promotes articles whose HTML is confirmed committed to git,
        # so articles can never appear in the feed before their page is live.
        run: node scripts/publish-articles.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INDEXNOW_KEY:         ${{ secrets.INDEXNOW_KEY }}

      - name: Regenerate news index + homepage prerender + refresh LATEST modules after publish
        # Articles are now published in Supabase — regenerate the static pages that
        # read the published set:
        #   - generate-index-pages --news : rebuilds /news/ so it includes new articles
        #     (generate-article.js runs this BEFORE publish, when they were still draft).
        #   - generate-home-prerender.js  : bakes the newest published article into
        #     index.html (hero card + <link rel="preload">) so the homepage matches
        #     the live top card with no stale-article flash.
        #   - refresh-modules.js          : re-bakes ONLY the LATEST / Top Stories /
        #     Featured / sidebar-modules regions on EVERY built page (brands, WITB,
        #     features, older articles, scorecard, etc.) so no page's baked sidebar
        #     goes stale after a publish. Baked/crawlable/zero-CLS is preserved; this
        #     touches module regions only, never article body prose or dateModified.
        # All committed in a SINGLE push so Vercel produces ONE deployment for the
        # complete post-publish state, keeping the deploy atomic and shrinking the
        # deploy race.
        run: |
          node scripts/generate-index-pages.js --news
          node scripts/generate-home-prerender.js
          node scripts/refresh-modules.js
          # llms.txt / llms-full.txt carry deep links to individual articles,
          # brands and player bags, so they go stale the moment anything
          # publishes. Regenerated here for the same reason the news index is.
          node scripts/generate-llms-txt.js

          git add -A

          if git diff --cached --quiet; then
            echo "News index + prerender + modules already up to date — nothing to commit."
          else
            git commit -m "chore: regenerate news index + homepage prerender + refresh LATEST modules after publish [skip ci]"
            git pull --rebase -X theirs origin main
            git push
            echo "News index + homepage prerender + LATEST modules updated and pushed."
          fi
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Ping search engines
        if: success()
        run: |
          SITEMAP_URL="https://dormied.com/sitemap.xml"

          # Ping Google
          GOOGLE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.google.com/ping?sitemap=${SITEMAP_URL}")
          echo "Google ping: HTTP ${GOOGLE_STATUS}"

          # Ping Bing
          BING_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.bing.com/ping?sitemap=${SITEMAP_URL}")
          echo "Bing ping: HTTP ${BING_STATUS}"
