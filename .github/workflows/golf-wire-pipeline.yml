name: Golf Wire Content Pipeline

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Max articles to generate per run (default: 5)'
        required: false
        type: string

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Step 1 — Scrape Golf Wire RSS
        run: node scripts/scrape-golfwire.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Step 2 — Match brands
        run: node scripts/match-brands.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Step 3 — Generate articles
        run: node scripts/generate-article.js ${{ github.event.inputs.max_articles || '' }}
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit generated articles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage new article pages and the updated sitemap
          git add news/ sitemap.xml

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No new articles generated — nothing to commit."
          else
            ARTICLE_COUNT=$(git diff --cached --name-only | grep "^news/" | grep "index.html" | wc -l | tr -d ' ')
            git commit -m "feat: add ${ARTICLE_COUNT} Golf Wire article(s) [skip ci]"
            git push
            echo "Committed and pushed ${ARTICLE_COUNT} new article(s)."
          fi
