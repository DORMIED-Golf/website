name: Monthly Brand Explanations

on:
  schedule:
    # Runs at 10:00 UTC on the 1st of every month (after index data is updated)
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to process in YYYY-MM format (leave blank for previous month)'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate brand explanations
        run: node scripts/generate-explanations.js ${{ github.event.inputs.month || '' }}
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
