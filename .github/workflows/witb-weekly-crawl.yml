name: WITB Weekly Crawl

# Runs every Tuesday at 13:00 UTC (Tuesday 9am ET, good for post-weekend bag updates)
# Can also be triggered manually from GitHub Actions tab

on:
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode (weekly or initial)'
        required: false
        default: 'weekly'
        type: choice
        options:
          - weekly
          - initial
      no_history:
        description: 'Skip historical bags (for initial mode)'
        required: false
        default: false
        type: boolean

jobs:
  witb-crawl:
    name: WITB Data Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3 hours max (covers a full initial scrape)
    permissions:
      contents: write      # required for git push after rebuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run WITB scrape (scheduled weekly)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/witb-scrape.js --mode=weekly

      - name: Run WITB scrape (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--mode=${{ inputs.mode }}"
          if [ "${{ inputs.no_history }}" = "true" ]; then
            ARGS="$ARGS --no-history"
          fi
          node scripts/witb-scrape.js $ARGS

      - name: Refresh OWGR rankings
        # Runs after bag scrape so the rebuilt page gets fresh ranks in the
        # same commit. owgr.com publishes new rankings every Monday, so running
        # this on Tuesday captures the week's update.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/witb-owgr-refresh.js

      - name: Patch OWGR ranks on player pages
        # Lightweight: reads each player's HTML file and updates only the
        # rank span + updated date. No Anthropic API calls. Runs in <5s.
        # Must run after witb-owgr-refresh.js so the DB has fresh ranks.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/patch-witb-owgr-ranks.js

      - name: Rebuild WITB players directory
        # Regenerates /witb/players/index.html (the player grid/listing).
        # Reads OWGR ranks directly from DB so always matches the refresh above.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/generate-witb-players-page.js

      - name: Rebuild WITB page
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/generate-witb-page.js

      - name: Commit and push rebuilt page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add witb/index.html js/witb-leaders.js witb/players/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "WITB weekly rebuild + OWGR refresh: $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Check crawl status
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          require('dotenv').config();
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
          sb.from('witb_crawl_runs')
            .select('run_type, status, players_scraped, bags_added, changes_detected, started_at, finished_at')
            .order('started_at', { ascending: false })
            .limit(1)
            .then(({ data }) => {
              if (data && data[0]) {
                const r = data[0];
                console.log('Last run:', JSON.stringify(r, null, 2));
                if (r.status === 'failed') {
                  console.error('CRAWL FAILED');
                  process.exit(1);
                }
              }
            });
          "
