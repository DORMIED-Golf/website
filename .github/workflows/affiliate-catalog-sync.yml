name: Affiliate Catalog Sync

# Daily at 08:00 UTC. The advertiser's feed updates ~06:19 UTC (observed from
# DateLastUpdated), so this leaves ~1h40m of margin. 08:00 is unused by the other
# scheduled jobs (golf-wire-pipeline 0 */3, post-to-x */30,
# witb-weekly-crawl Tue 13:00).
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch + map + report, write nothing'
        required: false
        default: false
        type: boolean

# No `permissions: contents: write` — this job only writes to Supabase, never to
# the repo. It produces no commit.
permissions:
  contents: read

jobs:
  sync:
    name: Impact catalog -> Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The script exits non-zero on an incomplete fetch or a tripped deactivation
      # ceiling. That exit code MUST fail the job: no `|| true`, no
      # continue-on-error, and no pipe (a pipe would report the exit status of the
      # last command in the pipeline, not the script). Run it bare.
      - name: Run affiliate catalog sync
        env:
          IMPACT_SID:           ${{ secrets.IMPACT_SID }}
          IMPACT_TOKEN:         ${{ secrets.IMPACT_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-affiliate-catalog.js --dry-run
          else
            node scripts/sync-affiliate-catalog.js
          fi

      # Merchant-feed programs (Impact deep-link partners with no /Items catalog).
      # Runs after the Impact sync and is independent of it: its rows are
      # source='shopify' and the Impact deactivation sweep cannot see them.
      # Failure here fails the job — a silently stale catalog is worse than a red run.
      #
      # if: '!cancelled()' is what makes "independent of it" true. Without it a
      # non-zero exit from the Impact step skips this one, and Malbon's catalog
      # silently freezes; shop-carousel.js then suppresses every price once
      # feed_updated_at passes STALE_HOURS. That is exactly what happened between
      # 28 Jul and 5 Aug 2026. Each sync still fails the job on its own exit code
      # — nothing is swallowed, they just no longer block each other.
      - name: Run Shopify catalog sync
        if: '!cancelled()'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-shopify-catalog.js --dry-run
          else
            node scripts/sync-shopify-catalog.js
          fi

      # CJ (Cobra + Puma Golf). One CJ advertiser carries both brands, so the
      # split onto /brands/cobra/ and /brands/puma-golf/ happens in the script,
      # off the feed's own brand field. Rows are source='cj' and invisible to the
      # other two sweeps. Failure fails the job — a silently stale catalog is
      # worse than a red run. if: '!cancelled()' for the same reason as above.
      - name: Run CJ catalog sync
        if: '!cancelled()'
        env:
          CJ_PAT:               ${{ secrets.CJ_PAT }}
          CJ_COMPANY_ID:        ${{ secrets.CJ_COMPANY_ID }}
          CJ_PID:               ${{ secrets.CJ_PID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-cj-catalog.js --dry-run
          else
            node scripts/sync-cj-catalog.js
          fi

      - name: Report sync state
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
          (async () => {
            const { data: progs } = await sb.from('affiliate_programs')
              .select('dormied_brand_slug, last_synced_at').not('dormied_brand_slug','is',null);
            for (const p of progs || []) console.log('last_synced_at', p.dormied_brand_slug, p.last_synced_at);
            const { count } = await sb.from('affiliate_products')
              .select('*', { count: 'exact', head: true }).eq('is_active', true);
            console.log('active products:', count);
            // Per source, so one path collapsing is visible rather than hidden
            // inside the total.
            for (const src of ['impact', 'shopify', 'cj']) {
              const { count: n } = await sb.from('affiliate_products')
                .select('*', { count: 'exact', head: true }).eq('is_active', true).eq('source', src);
              console.log('  active', src + ':', n);
            }
          })();
          "
