name: Post DORMIED Articles to X

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger post-to-x endpoint
        run: |
          # --max-time keeps a stalled request from burning the whole job
          # timeout and dying as an opaque cancellation with no logs. 240s
          # leaves headroom under timeout-minutes: 5 so curl reports the
          # failure itself and the "Failed with status" branch below runs.
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 240 \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dormied.com/api/post-to-x)
          echo "Response status: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✓ Success"
          else
            echo "✗ Failed with status $response"
            exit 1
          fi
