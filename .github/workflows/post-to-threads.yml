name: Post DORMIED Articles to Threads

on:
  schedule:
    # Every 30 minutes (offset by 15 min from X to stagger posts naturally)
    - cron: '15,45 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  post-to-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger post-to-threads endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dormied.com/api/post-to-threads)
          echo "Response status: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✓ Success"
          else
            echo "✗ Failed with status $response"
            exit 1
          fi
