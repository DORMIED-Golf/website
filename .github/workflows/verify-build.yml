name: Verify Build

# Structural checks on what is about to be served. These run on push because the
# repo IS the deploy artifact — Vercel serves the committed HTML, so a bad commit
# is a bad site. They are all offline: no Supabase, no Impact, no secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # css/styles.css and css/styles.min.css are both hand-maintained and
      # different page types load different files, so a rule added to one is
      # silently absent wherever the other is loaded. This has shipped twice.
      - name: CSS parity
        run: node scripts/verify-css-parity.js

      # Interactive markup is inert without the script that binds to it, and the
      # page still renders, so nothing else notices. The footer signup form
      # shipped on 193 pages that never loaded signup.min.js, including all 189
      # WITB player pages, and silently converted nobody.
      - name: Interactive markup has its handler
        run: npm run verify:page-scripts --silent

      # Every h2 in article bodies, features and the shared template blocks is
      # phrased as a question. The rule lives in six places (prompt, backfill,
      # feature markdown, template labels, the newsletter library, hand-maintained
      # pages), and a stale label in a hand-maintained page survives every re-bake.
      # Kept out of the publish pipeline on purpose: generate-article.js strips a
      # statement subheading itself, so publishing never stalls on a heading.
      - name: Headings are questions
        run: npm run verify:headings --silent

      # Titles fit in 60 characters and descriptions in 160, each page has one h1,
      # headings never skip a level, canonical and og:url agree, and every
      # indexable page is in the sitemap. Generators enforce these themselves;
      # this catches a hand edit or a template regression.
      - name: SEO structure
        run: npm run verify:seo --silent

      # Every sitemap URL must resolve to a file that exists.
      - name: Sitemap resolves
        run: npm run verify:sitemap --silent

      # The homepage ticker is baked from js/data.js at build time, into both
      # js/ticker-data.js and the prerendered tape in index.html. Nothing at
      # runtime recomputes it, so a data.js update that skips the regenerate
      # step would leave last month's numbers on the top of the homepage
      # looking perfectly current.
      - name: Homepage ticker is current
        run: npm run verify:ticker --silent
