<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <g fill="#22c55e">
    <!-- head -->
    <circle cx="50" cy="13" r="10"/>
    <!-- lead arm raised in high follow-through (left arm, going upper-right) -->
    <path d="M44 22 C50 16 60 10 70 5 C73 3 76 6 73 8 L64 14 L46 28 Z"/>
    <!-- torso: rotated toward target in follow-through -->
    <path d="M44 26 C36 30 32 42 34 54 L38 54 C37 44 40 34 46 28 L54 28 C60 34 62 44 60 54 L64 54 C66 42 62 30 56 26 Z"/>
    <!-- right arm trailing, bent at elbow (lower right of torso) -->
    <path d="M58 30 C64 28 70 32 68 40 L64 44 C62 38 60 34 56 32 Z"/>
    <!-- left leg (front, toward target) -->
    <path d="M34 54 L30 78 L38 78 L38 54 Z"/>
    <!-- right leg (pivot, behind) -->
    <path d="M60 54 L62 78 L70 78 L66 54 Z"/>
    <!-- club head: small oval at lower-left (impact position) -->
    <ellipse cx="20" cy="42" rx="5" ry="3" transform="rotate(-30 20 42)"/>
  </g>
  <!-- club shaft: arcs from impact zone (lower-left) up to grip at lead hand -->
  <path fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"
        d="M 22 40 C 30 34 38 28 46 26"/>
</svg>
