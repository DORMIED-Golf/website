<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 12">
  <!-- Wales: simplified bicolour (white top, green bottom) with red bar suggestion -->
  <!-- Full dragon would be too complex at 20x12; use bicolour with centre stripe -->
  <rect width="20" height="6" fill="#fff"/>
  <rect y="6" width="20" height="6" fill="#00ab39"/>
  <!-- Thin red centre stripe to differentiate from other bicolours -->
  <rect y="5.5" width="20" height="1" fill="#cf142b"/>
</svg>
