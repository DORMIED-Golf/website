<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 12">
  <!-- Northern Ireland: St Patrick's Cross (red saltire on white) -->
  <rect width="20" height="12" fill="#fff"/>
  <!-- Diagonal arms (stroke-based, centred) -->
  <line x1="0" y1="0" x2="20" y2="12" stroke="#cf142b" stroke-width="3.5" stroke-linecap="square"/>
  <line x1="20" y1="0" x2="0" y2="12" stroke="#cf142b" stroke-width="3.5" stroke-linecap="square"/>
</svg>
