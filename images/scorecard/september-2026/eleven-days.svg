<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732" viewBox="0 0 1200 732" role="img" aria-label="Eleven days">
<rect width="1200" height="732" fill="#060b06"/>
<rect x="0.5" y="0.5" width="1199" height="731" fill="none" stroke="#1a2e1a"/>
<text x="48" y="64" fill="#22c55e" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="34" font-weight="700" font-style="italic" letter-spacing="1">ELEVEN DAYS</text>
<text x="48" y="98" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="17">From the ad to the executive exits, August 20 to September 2, 2026.</text>
<line x1="230" x2="230" y1="144" y2="616" stroke="#14532d" stroke-width="4"/>
<text x="200" y="158" text-anchor="end" fill="#22c55e" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">AUG 20</text>
<circle cx="230" cy="150" r="10" fill="#060b06" stroke="#22c55e" stroke-width="4"/>
<text x="264" y="158" fill="#e2f0de" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="21" font-weight="700">Good Good posts the co-branded driver ad</text>
<text x="264" y="186" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">Deleted the same day</text>
<text x="200" y="250" text-anchor="end" fill="#22c55e" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">AUG 22</text>
<circle cx="230" cy="242" r="10" fill="#060b06" stroke="#22c55e" stroke-width="4"/>
<text x="264" y="250" fill="#e2f0de" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="21" font-weight="700">Callaway CEO Chip Brewer apologises</text>
<text x="264" y="278" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">Confirms Callaway approved the spot before it ran</text>
<text x="200" y="342" text-anchor="end" fill="#22c55e" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">AUG 25</text>
<circle cx="230" cy="334" r="10" fill="#060b06" stroke="#22c55e" stroke-width="4"/>
<text x="264" y="342" fill="#e2f0de" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="21" font-weight="700">Big Break season delayed</text>
<text x="264" y="370" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">Golf Galaxy asks for its branding to be removed</text>
<text x="200" y="434" text-anchor="end" fill="#22c55e" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">AUG 26</text>
<circle cx="230" cy="426" r="10" fill="#060b06" stroke="#22c55e" stroke-width="4"/>
<text x="264" y="434" fill="#e2f0de" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="21" font-weight="700">Retailers pull Good Good stock</text>
<text x="264" y="462" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">Before the PGA Tour says a word</text>
<text x="200" y="526" text-anchor="end" fill="#22c55e" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">AUG 27</text>
<circle cx="230" cy="518" r="10" fill="#060b06" stroke="#22c55e" stroke-width="4"/>
<text x="264" y="526" fill="#e2f0de" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="21" font-weight="700">Callaway ends the partnership</text>
<text x="264" y="554" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">Good Good steps away from its Austin PGA Tour event; Big Break cancelled</text>
<text x="200" y="618" text-anchor="end" fill="#22c55e" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700">SEP 2</text>
<circle cx="230" cy="610" r="10" fill="#22c55e" stroke="#22c55e" stroke-width="4"/>
<text x="264" y="618" fill="#e2f0de" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="21" font-weight="700">CEO and president leave</text>
<text x="264" y="646" fill="#8aa88a" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">Matt Kendrick and Joe Flannery depart; Nahid Giga named interim CEO</text>
<text x="1152" y="706" text-anchor="end" fill="#6b8f6b" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2">DORMIED INDEX</text>
</svg>
